name: ESP32 CI Test

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Install Python test dependencies
        run: pip install pyserial pytest

      - name: Run Unit Tests
        run: pytest tests/test_parsers.py -v
